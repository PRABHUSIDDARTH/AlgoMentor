<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AlgoMentor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f1a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    h1 { font-size: 2.5rem; color: #a78bfa; margin-bottom: 6px; }
    .subtitle { color: #888; margin-bottom: 30px; font-size: 0.95rem; }
    .card { background: #1a1a2e; border: 1px solid #2e2e4e; border-radius: 16px; padding: 30px; width: 100%; max-width: 780px; }
    textarea { width: 100%; background: #0f0f1a; border: 1px solid #3b3b5c; color: #e0e0e0; border-radius: 10px; padding: 14px; font-size: 0.95rem; resize: vertical; min-height: 160px; outline: none; }
    textarea:focus { border-color: #a78bfa; }
    .modes { display: flex; gap: 12px; margin: 16px 0; }
    .mode-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #3b3b5c; background: #0f0f1a; color: #aaa; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .mode-btn.active { background: #a78bfa; color: #fff; border-color: #a78bfa; }
    .ask-btn { width: 100%; padding: 14px; background: #7c3aed; color: white; border: none; border-radius: 10px; font-size: 1rem; cursor: pointer; margin-top: 4px; transition: background 0.2s; }
    .ask-btn:hover { background: #6d28d9; }
    .ask-btn:disabled { background: #444; cursor: not-allowed; }
    .result { margin-top: 24px; background: #0f0f1a; border: 1px solid #2e2e4e; border-radius: 10px; padding: 20px; font-size: 0.92rem; line-height: 1.7; display: none; overflow-wrap: anywhere; }
    .result.error { border-color: #f87171; color: #fca5a5; white-space: pre-wrap; }
    .result h1, .result h2, .result h3, .result h4 { color: #c4b5fd; margin: 18px 0 8px; line-height: 1.3; }
    .result h1 { font-size: 1.3rem; } .result h2 { font-size: 1.15rem; } .result h3, .result h4 { font-size: 1rem; }
    .result > :first-child { margin-top: 0; }
    .result p, .result ul, .result ol, .result pre, .result table, .result blockquote { margin: 0 0 12px; }
    .result ul, .result ol { padding-left: 22px; }
    .result li { margin: 4px 0; }
    .result a { color: #a78bfa; }
    .result code { font-family: 'Fira Code', Consolas, monospace; font-size: 0.86rem; background: #1e1e3a; padding: 2px 6px; border-radius: 4px; }
    .result pre { background: #0d1117; border: 1px solid #2e2e4e; border-radius: 8px; overflow-x: auto; }
    .result pre code { display: block; padding: 14px; background: none; }
    .result table { border-collapse: collapse; display: block; overflow-x: auto; }
    .result th, .result td { border: 1px solid #3b3b5c; padding: 6px 10px; text-align: left; }
    .result th { background: #1e1e3a; }
    .result blockquote { border-left: 3px solid #a78bfa; padding-left: 12px; color: #aaa; }
    .answer + .answer { margin-top: 16px; padding-top: 16px; border-top: 1px dashed #3b3b5c; }
    .answer.error { color: #fca5a5; white-space: pre-wrap; }
    .answer.streaming > :last-child::after { content: '▍'; color: #a78bfa; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .problem-info { display: none; margin-bottom: 12px; padding: 10px 14px; background: #0f0f1a; border: 1px solid #3b3b5c; border-radius: 10px; font-size: 0.88rem; color: #c4b5fd; }
    .problem-info .meta { color: #888; margin-left: 6px; }
    .problem-info a { color: #a78bfa; margin-left: 8px; }
    .problem-info .diff-easy { color: #4ade80; } .problem-info .diff-medium { color: #facc15; } .problem-info .diff-hard { color: #f87171; }
    .hint-actions { display: none; gap: 12px; margin-top: 16px; }
    .hint-actions button { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #a78bfa; background: #1e1e3a; color: #c4b5fd; cursor: pointer; font-size: 0.9rem; }
    .hint-actions button:hover { background: #2a2a4e; }
    .hint-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
    .tip { color: #666; font-size: 0.8rem; margin-top: 8px; }
    .loader { text-align: center; color: #a78bfa; margin-top: 20px; display: none; font-size: 0.95rem; }
    .badge { display: inline-block; background: #1e1e3a; color: #a78bfa; border: 1px solid #a78bfa44; border-radius: 20px; padding: 3px 12px; font-size: 0.78rem; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>⚡ AlgoMentor</h1>
  <p class="subtitle">Your AI-powered DSA problem assistant</p>
  <span class="badge">Powered by Gemini · Built by psTech</span>

  <div class="card">
    <div class="problem-info" id="problemInfo"></div>
    <textarea id="problem" placeholder="Paste a DSA problem — or just type a LeetCode number (e.g. 1) or link..."></textarea>
    <p class="tip">Tip: type <b>1</b> or <b>LC 146</b> to fetch the problem from LeetCode · Ctrl+Enter to ask</p>

    <div class="modes">
      <button class="mode-btn active" onclick="setMode('explain', this)">💡 Explain</button>
      <button class="mode-btn" onclick="setMode('hint', this)">🔍 Hint</button>
      <button class="mode-btn" onclick="setMode('solution', this)">✅ Solution</button>
    </div>

    <button class="ask-btn" id="askBtn" onclick="askAlgoMentor()">Ask AlgoMentor</button>

    <div class="loader" id="loader">⏳ AlgoMentor is thinking...</div>
    <div class="result" id="result"></div>

    <div class="hint-actions" id="hintActions">
      <button id="nextHintBtn" onclick="nextHint()">🔍 Next hint</button>
      <button onclick="showSolution()">✅ Show solution</button>
    </div>
  </div>

  <script>
    const MAX_HINTS = 4;
    const LC_NUMBER = /^(?:#|lc\s*#?|leetcode\s*#?)?\s*\d{1,5}\.?$/i;
    const LC_URL = /^(?:https?:\/\/)?(?:www\.)?leetcode\.(?:com|cn)\/problems\/[a-z0-9-]+\/?\S*$/i;

    const $ = id => document.getElementById(id);
    let currentMode = 'explain';
    let hints = [];          // hints shown so far for hintsProblem, oldest first
    let hintsProblem = null;
    let busy = false;

    function setMode(mode, btn) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(mode)));
      if (btn) btn.classList.add('active');
    }

    $('problem').addEventListener('input', () => {
      $('problemInfo').style.display = 'none';
      resetHints();
    });
    $('problem').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); askAlgoMentor(); }
    });

    function resetHints() {
      hints = [];
      hintsProblem = null;
      $('hintActions').style.display = 'none';
    }

    function setBusy(on, message) {
      busy = on;
      $('askBtn').disabled = on;
      $('nextHintBtn').disabled = on || hints.length >= MAX_HINTS;
      $('loader').textContent = message || '⏳ AlgoMentor is thinking...';
      $('loader').style.display = on && message !== null ? 'block' : 'none';
    }

    function newAnswerBlock(replace) {
      const result = $('result');
      if (replace) result.innerHTML = '';
      result.classList.remove('error');
      const block = document.createElement('div');
      block.className = 'answer';
      result.appendChild(block);
      result.style.display = 'block';
      return block;
    }

    function showErrorIn(block, message) {
      block.classList.remove('streaming');
      block.classList.add('error');
      block.textContent = '⚠️ ' + message;
    }

    function renderMarkdown(block, text, final) {
      block.innerHTML = DOMPurify.sanitize(marked.parse(text));
      if (final) block.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
    }

    async function errorFrom(res) {
      const data = await res.json().catch(() => ({}));
      return data.error || `Something went wrong (HTTP ${res.status}). Try again.`;
    }

    // Replaces a LeetCode number/link in the text box with the fetched statement.
    async function resolveLeetCode(input) {
      setBusy(true, '📥 Fetching problem from LeetCode...');
      const res = await fetch('/problem?ref=' + encodeURIComponent(input));
      if (!res.ok) throw new Error(await errorFrom(res));
      const p = await res.json();
      const statement = `${p.number}. ${p.title} (${p.difficulty})\n\n${p.statement}`;
      $('problem').value = statement;

      const info = $('problemInfo');
      info.innerHTML = '';
      const title = document.createElement('b');
      title.textContent = `📄 ${p.number}. ${p.title}`;
      const diff = document.createElement('span');
      diff.className = 'meta diff-' + (p.difficulty || '').toLowerCase();
      diff.textContent = p.difficulty;
      const tags = document.createElement('span');
      tags.className = 'meta';
      tags.textContent = p.tags.length ? '· ' + p.tags.join(', ') : '';
      const link = document.createElement('a');
      link.href = p.url; link.target = '_blank'; link.rel = 'noopener';
      link.textContent = 'View on LeetCode ↗';
      info.append(title, diff, tags, link);
      info.style.display = 'block';
      return statement;
    }

    // Streams an answer from /ask/stream into block. Returns the full text, or null on error.
    async function streamAnswer(payload, block) {
      const res = await fetch('/ask/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) { showErrorIn(block, await errorFrom(res)); return null; }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '', text = '', finished = false, renderQueued = false;
      block.classList.add('streaming');

      const handleEvent = raw => {
        let event = 'message', data = '';
        for (const line of raw.split(/\r?\n/)) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).replace(/^ /, '');
        }
        if (event === 'chunk') {
          if (!text) $('loader').style.display = 'none';
          text += JSON.parse(data).text;
          if (!renderQueued) {
            renderQueued = true;
            requestAnimationFrame(() => { renderQueued = false; if (!finished) renderMarkdown(block, text, false); });
          }
        } else if (event === 'error') {
          finished = true;
          showErrorIn(block, JSON.parse(data).error);
        } else if (event === 'done') {
          finished = true;
        }
      };

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let match;
        while ((match = buffer.match(/\r?\n\r?\n/))) {
          handleEvent(buffer.slice(0, match.index));
          buffer = buffer.slice(match.index + match[0].length);
        }
      }

      if (block.classList.contains('error')) return null;
      block.classList.remove('streaming');
      renderMarkdown(block, text, true);
      if (!finished) {
        const note = document.createElement('p');
        note.className = 'answer error';
        note.textContent = '⚠️ The answer was cut off. Try again.';
        block.appendChild(note);
        return null;
      }
      return text;
    }

    async function run(mode, previousHints, replace) {
      if (busy) return;
      let problem = $('problem').value.trim();
      if (!problem) { showErrorIn(newAnswerBlock(true), 'Paste a problem first, or type a LeetCode number.'); return; }

      try {
        if (LC_NUMBER.test(problem) || LC_URL.test(problem)) {
          problem = await resolveLeetCode(problem);
          resetHints();
          previousHints = [];
        }
        setBusy(true);
        const block = newAnswerBlock(replace);
        const text = await streamAnswer({ problem, mode, previousHints }, block);

        if (mode === 'hint' && text !== null) {
          hints = [...previousHints, text];
          hintsProblem = problem;
        }
      } catch (e) {
        showErrorIn(newAnswerBlock(true), e.message && !(e instanceof TypeError) ? e.message
          : 'Could not reach AlgoMentor. Check your connection and try again.');
      } finally {
        setBusy(false);
        const showHintActions = mode === 'hint' && hints.length > 0;
        $('hintActions').style.display = showHintActions ? 'flex' : 'none';
        $('nextHintBtn').textContent = hints.length >= MAX_HINTS
          ? '🔍 No more hints' : `🔍 Next hint (${hints.length + 1}/${MAX_HINTS})`;
        $('nextHintBtn').disabled = hints.length >= MAX_HINTS;
      }
    }

    function askAlgoMentor() {
      resetHints();  // Ask always starts over; "Next hint" continues
      run(currentMode, [], true);
    }

    function nextHint() {
      if ($('problem').value.trim() !== hintsProblem) { askAlgoMentor(); return; }
      run('hint', hints, false);
    }

    function showSolution() {
      setMode('solution');
      resetHints();
      run('solution', [], true);
    }
  </script>
</body>
</html>
