spring.application.name=AlgoMentor
server.port=${PORT:8080}
server.shutdown=graceful
# Compress text responses. text/event-stream is deliberately absent so streamed answers aren't buffered.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

algomentor.gemini.api-key=${GEMINI_API_KEY:}
algomentor.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
algomentor.max-problem-chars=12000
algomentor.max-hints=4
algomentor.max-request-bytes=65536
algomentor.rate-limit.per-minute=10
algomentor.rate-limit.per-day=100
algomentor.problem-rate-limit.per-minute=20
algomentor.problem-rate-limit.per-day=300
algomentor.leetcode.base-url=https://leetcode.com
# Optional fine-grained token with public-repo read only. Without it GitHub allows 60 API calls an hour for the whole
# server, and one Git check uses 3 to 24 of them, so set it in production.
algomentor.github.token=${GITHUB_TOKEN:}

management.endpoints.web.exposure.include=health

# "The project that got me in": submissions wait for review in a JSON file; set a path on a persistent disk in production.
algomentor.contributions.file=${CONTRIBUTIONS_FILE:}
# Enables /admin/review and the review API. Leave empty to turn review off.
algomentor.admin-token=${ADMIN_TOKEN:}
