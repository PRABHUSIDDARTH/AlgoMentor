<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AlgoMentor: an AI mentor for data structures and algorithms. One hint at a time, then the optimal solution." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AlgoMentor</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      (function () {
        var choice = null
        try { choice = localStorage.getItem('algomentor.theme') } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
